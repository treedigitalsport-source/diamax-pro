<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIAMAX PRO — Prototipo 3: Apple Watch Ultra Fitness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --watch-bg: #0D0D11;
      --watch-surface: rgba(22, 22, 30, 0.7);
      --watch-border: rgba(255, 255, 255, 0.08);
      --watch-text: #FFFFFF;
      --watch-sub: #8E8E93;
      --watch-silver: #A1A1AA;
      --ring-green: #30D158;
      --ring-amber: #FF9F0A;
      --ring-red: #FF453A;
      --ring-blue: #007AFF;
      --squircle: 14px;
      --font-apple: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--watch-bg);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(48, 209, 88, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 122, 255, 0.06) 0%, transparent 40%);
      color: var(--watch-text);
      font-family: var(--font-apple);
      min-height: 100vh;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* HEADER FITNESS CLEAN */
    .watch-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--watch-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--watch-border);
      border-radius: var(--squircle);
      padding: 14px 20px;
    }

    .watch-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* REGLA 5: PUNTO BRILLANTE DE 6PX SIN RECTÁNGULOS DETRÁS */
    .watch-status-dot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #FFF;
      margin-left: 8px;
    }

    .dot-6px {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ring-green);
      box-shadow: 0 0 8px var(--ring-green);
    }

    /* REGLA 3: BOTONES SUPERIORES LIMPIOS SIN BORDES PESADOS */
    .watch-tools {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .watch-tool-btn {
      background: transparent;
      border: none;
      color: var(--watch-silver);
      font-size: 11.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 10px;
      transition: all 0.2s;
    }

    .watch-tool-btn svg { stroke: var(--watch-sub); }

    .watch-tool-btn:hover {
      color: #FFF;
      background: rgba(255, 255, 255, 0.06);
    }

    .watch-tool-btn:hover svg { stroke: #FFF; }

    .watch-exit-btn {
      background: transparent;
      border: none;
      color: var(--watch-sub);
      font-size: 11.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border-radius: 10px;
      transition: all 0.2s;
    }

    .watch-exit-btn:hover {
      background: rgba(255, 69, 58, 0.12);
      color: var(--ring-red);
    }

    .watch-exit-btn:hover svg { stroke: var(--ring-red); }

    /* REGLA 4: SEGMENTED CONTROL NATIVO */
    .watch-nav-bar {
      display: flex;
      justify-content: center;
    }

    .watch-segments {
      background: rgba(18, 22, 34, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--watch-border);
      border-radius: var(--squircle);
      padding: 4px;
      display: inline-flex;
      gap: 4px;
    }

    .watch-segment-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--watch-sub);
      font-size: 12px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .watch-segment-btn svg { stroke: var(--watch-sub); }

    .watch-segment-btn:hover:not(.active) {
      color: #FFF;
      background: rgba(255, 255, 255, 0.04);
    }

    .watch-segment-btn.active {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.18);
      color: #FFF;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .watch-segment-btn.active svg {
      stroke: var(--ring-blue);
      filter: drop-shadow(0 0 6px rgba(0, 122, 255, 0.6));
    }

    /* REGLA 5: MARCADOR GIGANTE APPLE WATCH (64PX SEMIBOLD BLANCO PURO) */
    .watch-scoreboard-hero {
      background: var(--watch-surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--watch-border);
      border-radius: var(--squircle);
      padding: 28px 32px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 28px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }

    .watch-team {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .watch-team-title {
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .watch-score-massive {
      font-size: 64px;
      font-weight: 600;
      color: #FFFFFF;
      line-height: 1;
      letter-spacing: -2px;
    }

    /* CENTRO KINÉTICO: ANILLOS Y CUENTA */
    .watch-center-rings {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 0 24px;
      border-left: 1px solid var(--watch-border);
      border-right: 1px solid var(--watch-border);
    }

    .watch-inn-badge {
      font-size: 13px;
      font-weight: 800;
      color: var(--ring-amber);
      letter-spacing: 1px;
    }

    .rings-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .ring-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .ring-lbl {
      font-size: 10px;
      font-weight: 700;
      color: var(--watch-sub);
    }

    .ring-dots-cluster {
      display: flex;
      gap: 4px;
    }

    .ring-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
    }

    .ring-dot.ball-on {
      background: var(--ring-green);
      box-shadow: 0 0 10px var(--ring-green);
      border-color: var(--ring-green);
    }

    .ring-dot.strike-on {
      background: var(--ring-amber);
      box-shadow: 0 0 10px var(--ring-amber);
      border-color: var(--ring-amber);
    }

    .ring-dot.out-on {
      background: var(--ring-red);
      box-shadow: 0 0 10px var(--ring-red);
      border-color: var(--ring-red);
    }

    /* BOTONERA TÁCTIL ERGONÓMICA SQUIRCLE */
    .watch-touch-deck {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .watch-deck-btn {
      background: var(--watch-surface);
      border: 1px solid var(--watch-border);
      border-radius: var(--squircle);
      padding: 16px 12px;
      color: #FFF;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .watch-deck-btn svg { stroke: var(--watch-sub); }

    .watch-deck-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }

    .watch-deck-btn:hover svg { stroke: #FFF; }
  </style>
</head>
<body>

  <header class="watch-header">
    <div class="watch-title" style="display:flex; align-items:center; gap:10px;">
      <!-- 💎 LOGO OFICIAL HOME PLATE DIAMOND 3D PÁGINA 1 -->
      <div style="display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%); border:1px solid rgba(255,255,255,0.18); box-shadow:0 4px 14px rgba(0,0,0,0.5); backdrop-filter:blur(10px); flex-shrink:0;">
        <svg width="22" height="22" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter:drop-shadow(0 2px 8px rgba(24,216,255,0.7));">
          <defs>
            <linearGradient id="hp3d-p3w-base" x1="18" y1="4" x2="18" y2="33" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="35%" stop-color="#E2E8F0"/><stop offset="70%" stop-color="#64748B"/><stop offset="100%" stop-color="#0F172A"/></linearGradient>
            <linearGradient id="hp3d-p3w-rim" x1="4" y1="4" x2="32" y2="32" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#18D8FF"/><stop offset="45%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#0284C7"/></linearGradient>
            <linearGradient id="hp3d-p3w-inner" x1="18" y1="8" x2="18" y2="28" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0F243E"/><stop offset="50%" stop-color="#081426"/><stop offset="100%" stop-color="#020814"/></linearGradient>
          </defs>
          <polygon points="18,33 5,20 5,5 31,5 31,20" fill="url(#hp3d-p3w-base)" stroke="url(#hp3d-p3w-rim)" stroke-width="1.8" stroke-linejoin="round"/>
          <polygon points="18,28 8,18 8,8 28,8 28,18" fill="url(#hp3d-p3w-inner)" stroke="rgba(255,255,255,0.35)" stroke-width="1" stroke-linejoin="round"/>
          <polygon points="18,23 11,16 11,11 25,11 25,16" fill="url(#hp3d-p3w-base)" opacity="0.95"/>
          <polygon points="18,19 13,14 13,12 23,12 23,14" fill="url(#hp3d-p3w-rim)"/>
          <line x1="5" y1="5" x2="18" y2="18" stroke="rgba(255,255,255,0.8)" stroke-width="0.8"/>
          <line x1="31" y1="5" x2="18" y2="18" stroke="rgba(255,255,255,0.8)" stroke-width="0.8"/>
          <line x1="18" y1="18" x2="18" y2="33" stroke="rgba(255,255,255,0.9)" stroke-width="1"/>
        </svg>
      </div>
      <div style="display:flex; align-items:baseline; gap:5px;">
        <span style="color:#FFFFFF; background:linear-gradient(180deg, #FFFFFF 0%, #B8C2CC 35%, #FFFFFF 55%, #737F8C 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-weight:900; font-size:19px;">DIAMAX</span>
        <span style="color:#FFB300; background:linear-gradient(180deg, #FFF2A6 0%, #FFB300 40%, #F57C00 70%, #FFD75A 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-weight:900; font-size:15px;">PRO</span>
      </div>
      <div class="watch-status-dot"><div class="dot-6px"></div> EN VIVO REACTIVO</div>
    </div>

    <div class="watch-tools">
      <button class="watch-tool-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        Audio ON
      </button>
      <button class="watch-tool-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
        Español
      </button>
      <button class="watch-tool-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/></svg>
        Luz Solar
      </button>
      <button class="watch-exit-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M18.36 6.64A9 9 0 1 1 5.64 6.64"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
        Salir
      </button>
    </div>
  </header>

  <div class="watch-nav-bar">
    <nav class="watch-segments">
      <button class="watch-segment-btn active">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="22" y1="12" x2="18" y2="12"/></svg>
        1. Anotador
      </button>
      <button class="watch-segment-btn">2. Alineación</button>
      <button class="watch-segment-btn">3. Terreno</button>
      <button class="watch-segment-btn">4. Manual</button>
      <button class="watch-segment-btn">5. Tarjeta</button>
      <button class="watch-segment-btn">6. IA Táctica</button>
      <button class="watch-segment-btn">7. Perfil</button>
    </nav>
  </div>

  <section class="watch-scoreboard-hero">
    <div class="watch-team">
      <span class="watch-team-title" style="color:var(--watch-silver);">DAYTONA BEACH</span>
      <span style="font-size:11px; color:var(--watch-sub);">Visitante</span>
      <span class="watch-score-massive">0</span>
    </div>

    <div class="watch-center-rings">
      <span class="watch-inn-badge">INNING 1 • ALTA</span>
      <div class="rings-row">
        <div class="ring-item">
          <span class="ring-lbl">BOLAS</span>
          <div class="ring-dots-cluster">
            <div class="ring-dot ball-on"></div><div class="ring-dot"></div><div class="ring-dot"></div><div class="ring-dot"></div>
          </div>
        </div>
        <div class="ring-item">
          <span class="ring-lbl">STRIKES</span>
          <div class="ring-dots-cluster">
            <div class="ring-dot strike-on"></div><div class="ring-dot strike-on"></div><div class="ring-dot"></div>
          </div>
        </div>
        <div class="ring-item">
          <span class="ring-lbl">OUTS</span>
          <div class="ring-dots-cluster">
            <div class="ring-dot out-on"></div><div class="ring-dot"></div><div class="ring-dot"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="watch-team" style="text-align:right; align-items:flex-end;">
      <span class="watch-team-title" style="color:var(--ring-blue);">GUERREROS VNZ</span>
      <span style="font-size:11px; color:var(--watch-sub);">Home Club</span>
      <span class="watch-score-massive">0</span>
    </div>
  </section>

  <div class="watch-touch-deck">
    <button class="watch-deck-btn" style="border-left:3px solid var(--ring-amber);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
      STRIKE CAN
    </button>
    <button class="watch-deck-btn" style="border-left:3px solid var(--ring-amber);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>
      STRIKE TIR
    </button>
    <button class="watch-deck-btn" style="border-left:3px solid var(--ring-green);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
      BOLA MALA
    </button>
    <button class="watch-deck-btn" style="border-left:3px solid var(--ring-red);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      OUT DIRECTO
    </button>
  </div>

</body>
</html>
