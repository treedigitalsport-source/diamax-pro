<!DOCTYPE html>
<html>
<head><title>Make Logo Transparent</title></head>
<body>
<canvas id="c"></canvas>
<script>
window.onload = function() {
  const img = new Image();
  img.crossOrigin = 'Anonymous';
  img.onload = function() {
    const canvas = document.getElementById('c');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = imgData.data;
    
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], g = d[i+1], b = d[i+2];
      const max = Math.max(r, g, b);
      
      // Black / dark background removal
      if (max < 22) {
        d[i+3] = 0; // 100% transparent
      } else if (max < 75) {
        // Soft gradient feathering
        const factor = (max - 22) / (75 - 22);
        d[i+3] = Math.round(255 * factor);
      }
    }
    
    ctx.putImageData(imgData, 0, 0);
    window.TRANSPARENT_DATA_URL = canvas.toDataURL('image/png');
    document.body.setAttribute('data-ready', 'true');
  };
  img.src = './assets/logo.png?' + Date.now();
};
</script>
</body>
</html>
