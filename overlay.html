<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIAMAX PRO · Broadcast Overlay (OBS / vMix)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif !important; }
    body {
      background: transparent;
      overflow: hidden;
      padding: 16px;
    }
    .overlay-bug {
      display: inline-flex;
      align-items: center;
      background: rgba(2, 6, 23, 0.92);
      border: 1.5px solid #00D2FF;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.85), 0 0 20px rgba(0, 210, 255, 0.35);
      backdrop-filter: blur(12px);
      overflow: hidden;
      font-variant-numeric: tabular-nums;
    }
    .team-badge {
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .team-gve { background: linear-gradient(135deg, rgba(242, 101, 34, 0.25), rgba(2, 6, 23, 0.9)); color: #FFF; border-right: 1px solid rgba(255, 255, 255, 0.1); }
    .team-score { font-size: 18px; font-weight: 900; color: #FFC72C; margin-left: 6px; }
    .team-riv { background: rgba(15, 23, 42, 0.85); color: #CBD5E1; border-right: 1px solid rgba(255, 255, 255, 0.1); }
    .inning-badge {
      background: #00D2FF;
      color: #020617;
      font-size: 12px;
      font-weight: 900;
      padding: 8px 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .bso-section {
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(3, 7, 18, 0.9);
      font-size: 11px;
      font-weight: 900;
      color: #94A3B8;
    }
    .bso-item { display: flex; align-items: center; gap: 4px; }
    .led { width: 7px; height: 7px; border-radius: 50%; background: #334155; }
    .led-green { background: #10B981; box-shadow: 0 0 6px #10B981; }
    .led-amber { background: #FFC72C; box-shadow: 0 0 6px #FFC72C; }
    .led-red { background: #EF4444; box-shadow: 0 0 6px #EF4444; }
  </style>
</head>
<body>
  <div class="overlay-bug" id="obs-score-bug">
    <div class="team-badge team-gve">
      <span>GUERREROS</span>
      <span class="team-score" id="ov-score-us">5</span>
    </div>
    <div class="team-badge team-riv">
      <span>TIBURONES</span>
      <span class="team-score" id="ov-score-them">3</span>
    </div>
    <div class="inning-badge" id="ov-inning">4 ▲ ALTA</div>
    <div class="bso-section">
      <div class="bso-item">
        <span>B</span>
        <span class="led led-green"></span>
        <span class="led led-green"></span>
        <span class="led"></span>
        <span class="led"></span>
      </div>
      <div class="bso-item">
        <span>S</span>
        <span class="led led-amber"></span>
        <span class="led"></span>
        <span class="led"></span>
      </div>
      <div class="bso-item">
        <span>O</span>
        <span class="led led-red"></span>
        <span class="led led-red"></span>
        <span class="led"></span>
      </div>
    </div>
  </div>
</body>
</html>
