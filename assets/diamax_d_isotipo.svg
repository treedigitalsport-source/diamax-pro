<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente Base Titanio Obsidian (Fondo Placa) -->
    <linearGradient id="plateObsidianBase" x1="50" y1="12" x2="50" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18233C"/>
      <stop offset="45%" stop-color="#0B1328"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Borde Exterior Oro Noble & Fuego 3Tree -->
    <linearGradient id="plateGoldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Gradiente Monograma D Tallado en Oro y Sol -->
    <linearGradient id="monogramGold" x1="40" y1="30" x2="68" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FEF08A"/>
      <stop offset="55%" stop-color="#FFC72C"/>
      <stop offset="100%" stop-color="#F26522"/>
    </linearGradient>

    <!-- Resplandor Dorado y Cian 3D -->
    <filter id="plateGoldDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#FFC72C" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Sombra 3D Profunda -->
  <polygon points="50,92 13,54 13,14 87,14 87,54" fill="#020617" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.98))"/>

  <!-- Placa Principal Home Plate Pentagonal -->
  <polygon points="50,89 14,53 14,14 86,14 86,53" 
           fill="url(#plateObsidianBase)" 
           stroke="url(#plateGoldBorder)" 
           stroke-width="2.8" 
           stroke-linejoin="round"
           filter="url(#plateGoldDrop)"/>

  <!-- Bisel Interior Reflejante -->
  <polygon points="50,78 23,48 23,22 77,22 77,48" 
           fill="none" 
           stroke="rgba(255,255,255,0.4)" 
           stroke-width="1.2" 
           stroke-linejoin="round"/>

  <!-- Costuras Dinámicas de Pelota de Béisbol (Trayectorias Curvas) -->
  <path d="M 28 19 C 36 38, 36 50, 48 76" stroke="#F26522" stroke-width="1.8" stroke-dasharray="3 2" fill="none" opacity="0.9"/>
  <path d="M 72 19 C 64 38, 64 50, 52 76" stroke="#F26522" stroke-width="1.8" stroke-dasharray="3 2" fill="none" opacity="0.9"/>

  <!-- Monograma 'D' Esculpido de Alta Precisión -->
  <path d="M 38 31 L 54 31 C 64 31, 69 37, 69 46 C 69 55, 64 61, 54 61 L 38 61 Z M 46 38 L 46 54 L 53 54 C 58 54, 61 51, 61 46 C 61 41, 58 38, 53 38 Z" 
        fill="url(#monogramGold)" 
        stroke="#FFFFFF" 
        stroke-width="0.8" 
        stroke-linejoin="round"
        filter="drop-shadow(0 0 8px rgba(255,199,44,0.75))"/>

  <!-- Nodo Central de Enfoque Cian Sabermétrico -->
  <circle cx="53" cy="46" r="2.5" fill="#00D2FF" filter="drop-shadow(0 0 4px #00D2FF)"/>

  <!-- Destello Superior de Luz Cromo -->
  <line x1="22" y1="18" x2="78" y2="18" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
</svg>
