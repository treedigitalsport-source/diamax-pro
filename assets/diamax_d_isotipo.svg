<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente Base Titanio Obsidian (Fondo Placa) -->
    <linearGradient id="plateObsidianBase" x1="50" y1="12" x2="50" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="45%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Borde Exterior Oro Noble & Fuego 3Tree -->
    <linearGradient id="plateGoldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="25%" stop-color="#FDE047"/>
      <stop offset="65%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#F26522"/>
    </linearGradient>

    <!-- Gradiente Monograma D Tallado en Oro y Sol -->
    <linearGradient id="monogramGold" x1="40" y1="30" x2="68" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#FEF08A"/>
      <stop offset="55%" stop-color="#FFC72C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Resplandor Dorado Ambiental Suave -->
    <filter id="plateGoldDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FFC72C" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- 1. Placa Principal Home Plate Pentagonal con Gradiente Obsidian Profundo -->
  <polygon points="50,90 12,52 12,12 88,12 88,52" 
           fill="url(#plateObsidianBase)" 
           stroke="url(#plateGoldBorder)" 
           stroke-width="3.5" 
           stroke-linejoin="round"
           filter="url(#plateGoldDrop)"/>

  <!-- 2. Facetas Geométricas de Diamante Interno (Gleam 3D) -->
  <polygon points="50,90 50,50 12,52" fill="rgba(255,255,255,0.03)"/>
  <polygon points="50,90 50,50 88,52" fill="rgba(0,0,0,0.25)"/>
  <polygon points="50,50 12,12 88,12" fill="rgba(255,255,255,0.05)"/>

  <!-- 3. Bisel Interior Reflejante Cromo -->
  <polygon points="50,79 21,47 21,20 79,20 79,47" 
           fill="none" 
           stroke="rgba(255,255,255,0.4)" 
           stroke-width="1.2" 
           stroke-linejoin="round"/>

  <!-- 4. Costuras de Béisbol Dinámicas (Curvas de Alta Fidelidad) -->
  <path d="M 26 18 C 35 36, 35 52, 47 76" stroke="#F26522" stroke-width="1.8" fill="none" opacity="0.9"/>
  <path d="M 74 18 C 65 36, 65 52, 53 76" stroke="#F26522" stroke-width="1.8" fill="none" opacity="0.9"/>

  <!-- Puntadas Chevron de Béisbol (Costura Izquierda) -->
  <line x1="23" y1="21" x2="28" y2="23" stroke="#FF5722" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="26" y1="30" x2="31" y2="31" stroke="#FF5722" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="29" y1="39" x2="34" y2="39" stroke="#FF5722" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="32" y1="49" x2="37" y2="48" stroke="#FF5722" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="37" y1="59" x2="41" y2="57" stroke="#FF5722" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="42" y1="68" x2="46" y2="65" stroke="#FF5722" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Puntadas Chevron de Béisbol (Costura Derecha) -->
  <line x1="77" y1="21" x2="72" y2="23" stroke="#FF5722" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="74" y1="30" x2="69" y2="31" stroke="#FF5722" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="71" y1="39" x2="66" y2="39" stroke="#FF5722" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="68" y1="49" x2="63" y2="48" stroke="#FF5722" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="63" y1="59" x2="59" y2="57" stroke="#FF5722" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="58" y1="68" x2="54" y2="65" stroke="#FF5722" stroke-width="1.4" stroke-linecap="round"/>

  <!-- 5. Monograma 'D' Esculpido de Alta Precisión con Bisel Cromo -->
  <path d="M 37 29 L 55 29 C 66 29, 71 36, 71 46 C 71 56, 66 63, 55 63 L 37 63 Z M 45 37 L 45 55 L 54 55 C 60 55, 63 51, 63 46 C 63 41, 60 37, 54 37 Z" 
        fill="url(#monogramGold)" 
        stroke="#FFFFFF" 
        stroke-width="1" 
        stroke-linejoin="round"
        filter="drop-shadow(0 0 12px rgba(255,199,44,0.9))"/>

  <!-- 6. Nodo Central de Enfoque Sabermétrico Cian -->
  <circle cx="54" cy="46" r="3.2" fill="#00E5FF" stroke="#FFFFFF" stroke-width="0.8" filter="drop-shadow(0 0 8px #00E5FF)"/>

  <!-- 7. Destello Superior de Luz Cromo -->
  <line x1="20" y1="16" x2="80" y2="16" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.95"/>
</svg>
