<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Cromo Especular Pulido -->
    <linearGradient id="plateChromeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="22%" stop-color="#E2E8F0"/>
      <stop offset="45%" stop-color="#94A3B8"/>
      <stop offset="68%" stop-color="#334155"/>
      <stop offset="85%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Borde de Luz Azul Tecnológica #00D2FF -->
    <linearGradient id="plateCyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="30%" stop-color="#22D3EE"/>
      <stop offset="70%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Bisel Dorado #FFB300 -->
    <linearGradient id="plateGoldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="35%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <filter id="plateNeonDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00D2FF" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Sombra 3D Profunda -->
  <polygon points="50,92 13,54 13,15 87,15 87,54" fill="#020617" filter="drop-shadow(0 10px 18px rgba(0,0,0,0.98))"/>

  <!-- Placa Principal Home Plate Cromada -->
  <polygon points="50,88 15,52 15,15 85,15 85,52" 
           fill="url(#plateChromeBody)" 
           stroke="url(#plateCyanGlow)" 
           stroke-width="3" 
           stroke-linejoin="round"
           filter="url(#plateNeonDrop)"/>

  <!-- Bisel Interior Reflejante -->
  <polygon points="50,78 24,47 24,23 76,23 76,47" 
           fill="none" 
           stroke="rgba(255,255,255,0.75)" 
           stroke-width="1.8" 
           stroke-linejoin="round"/>

  <!-- Diamante Central Dorado (Las 4 Bases de Béisbol) -->
  <polygon points="50,31 65,46 50,61 35,46" 
           fill="url(#plateGoldAccent)" 
           stroke="#FFFFFF" 
           stroke-width="1.4"
           stroke-linejoin="round"
           filter="drop-shadow(0 0 10px rgba(255,179,0,0.85))"/>

  <!-- Punto Central del Diamante -->
  <circle cx="50" cy="46" r="3" fill="#FFFFFF" filter="drop-shadow(0 0 4px #00D2FF)"/>

  <!-- Reflejo Especular Superior -->
  <line x1="22" y1="19" x2="78" y2="19" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
</svg>
